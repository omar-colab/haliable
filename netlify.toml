# Netlify configuration for the Haliable landing site.

[build]
  # Static site lives in site/ (isolated from the iOS source, which must
  # never be publicly served).
  publish = "site"
  # Serverless functions live here.
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Security headers for every page. The site has one inline script and loads
# only Google Fonts, so the CSP allows exactly that.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
