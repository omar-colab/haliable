# Netlify configuration for the Haliable landing site.

[build]
  # Static site lives in site/ (isolated from the iOS source, which must
  # never be publicly served).
  publish = "site"
  # Serverless functions live here.
  functions = "netlify/functions"
  # Only deploy when the site or its functions changed. Every iOS commit used to
  # trigger a production deploy and burned the free plan's monthly credits
  # (deploys blocked Oct 22 – Nov 10, 2026). Exit 0 = skip the build.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- site netlify netlify.toml"

[functions]
  node_bundler = "esbuild"

# Security headers for every page. The site has one inline script and serves
# its own fonts (site/fonts), so nothing third-party is allowed.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
